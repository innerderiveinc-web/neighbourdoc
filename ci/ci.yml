name: NeighbourDoc CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Security Tests & Production Builds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run Test Suite (28 Security & Autonomous Agent Tests)
        run: npm test

      - name: Run Typecheck Across Workspaces
        run: npm run typecheck

      - name: Build Web Application
        run: npm run build:web

      - name: Build Admin SaaS Console
        run: npm run build:admin

      - name: Build Doctor Clinical Cockpit
        run: npm run build:doctor
